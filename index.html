<!-- ============ SIGN IN ============ -->
<div class="signin" id="signin" hidden>
  <div class="signin-card">
    <img src="icon-192.png" alt="" class="signin-logo">
    <h1>Workbook</h1>
    <p class="lede">Every ask at work, organized. Sign in to sync between your computer and phone.</p>
    <div id="signinBody"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="shell" id="shell" hidden>
  <aside class="sidebar" aria-label="Sections">
    <div class="side-brand">
      <img src="icon-192.png" alt="">
      <div class="side-text">
        <div class="brand-name">Workbook</div>
        <div class="brand-sub" id="syncStatus"><span class="dot"></span><span class="txt">Connecting…</span></div>
      </div>
      <button class="side-toggle" id="sideToggle" type="button" aria-label="Collapse menu" title="Collapse menu ([)"><svg class="ic"><use href="#i-sidebar"/></svg></button>
    </div>
    <button class="btn primary block side-new" id="sideNew" type="button" title="New task (N)"><svg class="ic"><use href="#i-plus"/></svg><span class="side-text">New task</span> <kbd>N</kbd></button>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-foot">
      <button class="side-link" type="button" data-action="meeting" title="Meeting mode (M)"><svg class="ic"><use href="#i-meeting"/></svg><span class="side-text">Meeting mode</span> <kbd>M</kbd></button>
      <button class="side-link" type="button" data-action="export" title="Export &amp; reports"><svg class="ic"><use href="#i-download"/></svg><span class="side-text">Export &amp; reports</span></button>
      <button class="side-link" type="button" data-action="shortcuts" title="Shortcuts (?)"><svg class="ic"><use href="#i-keyboard"/></svg><span class="side-text">Shortcuts</span> <kbd>?</kbd></button>
      <button class="side-link" type="button" data-action="settings" title="Settings"><svg class="ic"><use href="#i-settings"/></svg><span class="side-text">Settings</span></button>
    </div>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <div class="brand">
        <img src="icon-192.png" alt="">
        <div>
          <div class="brand-name">Workbook</div>
          <div class="brand-sub" id="syncStatusM"><span class="dot"></span><span class="txt">Connecting…</span></div>
        </div>
      </div>
      <div class="actions">
        <button class="icon-btn" type="button" data-action="search" aria-label="Search"><svg class="ic"><use href="#i-search"/></svg></button>
        <button class="icon-btn" type="button" data-action="meeting" aria-label="Meeting mode"><svg class="ic"><use href="#i-meeting"/></svg></button>
      </div>
    </header>

    <main id="main">
      <section class="panel" data-panel="tasks" id="panel-tasks"></section>
      <section class="panel" data-panel="people" id="panel-people" hidden></section>
      <section class="panel" data-panel="projects" id="panel-projects" hidden></section>
      <section class="panel" data-panel="done" id="panel-done" hidden></section>
      <section class="panel" data-panel="review" id="panel-review" hidden></section>
    </main>
  </div>

  <button class="fab" id="fab" type="button" aria-label="New task"><svg class="ic"><use href="#i-plus"/></svg></button>

  <nav class="tabbar" aria-label="Main" id="tabbar"></nav>
</div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grabber"></div>
  <div class="sheet-head" id="sheetHead"></div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot" id="sheetFoot" hidden></div>
</div>

<div class="menu" id="menu" role="menu" hidden></div>

<div class="dialog" id="dialog" role="alertdialog">
  <div class="box">
    <h3 id="dialogTitle"></h3>
    <p id="dialogText"></p>
    <div class="btns"><button class="btn" id="dialogCancel" type="button">Cancel</button><button class="btn primary" id="dialogOk" type="button">OK</button></div>
  </div>
</div>

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button class="act" id="toastAct" type="button" hidden></button></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="js/core.js?v=13"></script>
<script src="js/model.js?v=13"></script>
<script src="js/store.js?v=13"></script>
<script src="js/components.js?v=13"></script>
<script src="js/shots.js?v=13"></script>
<script src="js/editor.js?v=13"></script>
<script src="js/views/today.js?v=13"></script>
<script src="js/views/tasks.js?v=13"></script>
<script src="js/views/people.js?v=13"></script>
<script src="js/views/projects.js?v=13"></script>
<script src="js/views/done.js?v=13"></script>
<script src="js/views/review.js?v=13"></script>
<script src="js/export.js?v=13"></script>
<script src="js/shortcuts.js?v=13"></script>
<script src="js/app.js?v=13"></script>
</body>
</html>
